; Vorlage. Als config.ini in denselben Ordner kopieren und ausfuellen.
; config.ini enthaelt Passwoerter und gehoert NICHT ins Repository.

[allgemein]
; Pfad zu Neolink (Windows: ...\neolink.exe). Relativ = relativ zu diesem Ordner.
neolink = neolink\neolink.exe
; ffmpeg: wird vom Einrichtungsskript nach ffmpeg\bin geladen. Unter Linux einfach: ffmpeg
ffmpeg = ffmpeg\bin\ffmpeg.exe
; Ablage der Bilder, Videos und des Protokolls.
daten = daten
; Nur Windows, nur falls GStreamer nicht automatisch gefunden wird:
; gstreamer_bin = C:\Program Files\gstreamer\1.0\msvc_x86_64\bin
timeout_sekunden = 150
; Falls das Standbild scheitert, Bild aus dem Videostream erzeugen (langsamer).
stream_ersatz = ja

[server]
url = https://DEINE-DOMAIN/zeitraffer/api.php
api_schluessel = GLEICHER-SCHLUESSEL-WIE-IN-DER-SERVER-CONFIG

[zeitplan]
; Tagzeit: alle 5 Minuten. Nachts: einmal pro Stunde.
tag_von = 6
tag_bis = 20
tag_intervall_minuten = 5
nacht_intervall_minuten = 60

[video]
aktiv = ja
; Tagesvideo: alle Tagbilder. Gesamtvideo: je Tag ein Bild pro Stunde.
bilder_pro_sekunde = 12
breite = 1920
qualitaet_crf = 24
gesamt_intervall_minuten = 60

; Je Kamera ein Abschnitt. Der Name nach "kamera:" muss gleich sein wie in der Server-config.php.
[kamera:esther-reier-weg-8]
uid = 9527000N280ZUMFN
benutzer = admin
passwort = HIER-KAMERAPASSWORT
